<!DOCTYPE html>
<html lang="en">

<head>
    <!-- Sets the character encoding so the page can display text correctly -->
    <meta charset="UTF-8">

    <!-- Makes the website scale properly on phones, tablets, and computers -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- The title that appears in the browser tab -->
    <title>Spinning Room</title>

    <!-- Connects this HTML file to the external CSS stylesheet -->
    <link rel="stylesheet" href="jordan.css">
</head>

<body>

    <nav class="site-nav" aria-label="Main navigation">
        <span class="nav-title">Spinning Room</span>
        <div class="nav-links">
            <a href="index.html">Home</a>
            <a href="page1.html">Spinning Cars</a>
            <a href="page2.html">About Lamborghini</a>
            <a href="page3.html">Lamborghini History</a>
        </div>
        <span class="nav-status" aria-live="polite">Locked</span>
    </nav>

    <!-- ==============================
         PAGE HEADER
         ============================== -->

    <header>

        <!-- Main heading of the webpage -->
        <h1>Super-Happy Fun Room</h1>

        <!-- Short introduction underneath the heading -->
        <p>Welcome to the spinning room!</p>

    </header>


    <main>
        <!-- Keeps the moving button and spinning images inside the visual area. -->
        <div class="home-stage">

        <!-- ==============================
             SPINNING EGG
             ============================== -->

        <!--
            Displays the spinning egg image.
            The "spinning-egg" class is used by CSS
            to make the image spin.
        -->
            <img
                src="images/Spinegg.jpg"
                alt="A spinning egg"
                class="spinning-egg"
            >


        <!-- ==============================
             WHEEZER CONTAINER
             ============================== -->

        <!--
            Container that holds the Wheezer image.
            JavaScript uses this container to work out
            where the image can safely move.
        -->
            <div class="container">

            <!--
                Displays the Wheezer image.
                The "wheezer" class is used by CSS and
                JavaScript to control its appearance
                and movement.
            -->
                <img
                    src="images/Wheezer.jpg"
                    alt="Wheezer"
                    class="wheezer"
                >

            </div>


        <!-- ==============================
             RUNAWAY BUTTON
             ============================== -->

        <!--
            Button that moves away from the mouse.
            JavaScript finds this button using its ID.
        -->
            <button id="runawayButton">Catch me!</button>
        </div>

    </main>

    <script>
        const navigation = document.querySelector(".site-nav");
        const navigationLinks = navigation.querySelectorAll("a");
        const isUnlocked = sessionStorage.getItem("navUnlocked") === "true";
        const status = navigation.querySelector(".nav-status");

        navigation.classList.toggle("is-locked", !isUnlocked);
        navigation.classList.toggle("is-unlocked", isUnlocked);
        status.textContent = isUnlocked ? "Unlocked" : "Locked";
        navigationLinks.forEach((link) => {
            link.setAttribute("aria-disabled", String(!isUnlocked));

            if (!isUnlocked) {
                link.addEventListener("click", (event) => event.preventDefault());
            }
        });
    </script>


    <script>

        /* =========================================
           RUNAWAY BUTTON
           ========================================= */


        // Find the button using its ID and store it in a variable.
        const button = document.getElementById("runawayButton");
        const homeStage = document.querySelector(".home-stage");
        let previousPointer = null;
        let lastEscapeTime = 0;


        // Listen for the mouse moving anywhere on the webpage.
        document.addEventListener("mousemove", (event) => {

            // Measure how quickly the pointer moved since the last event.
            const currentTime = performance.now();
            const elapsed = previousPointer
                ? Math.max(1, currentTime - previousPointer.time)
                : 0;
            const pointerDistance = previousPointer
                ? Math.hypot(
                    event.clientX - previousPointer.x,
                    event.clientY - previousPointer.y
                )
                : 0;
            const pointerSpeed = elapsed ? pointerDistance / elapsed : 0;

            previousPointer = {
                x: event.clientX,
                y: event.clientY,
                time: currentTime
            };

            // Get the button's position and size on the screen.
            const rect = button.getBoundingClientRect();

            // Expand the button's hit area so fast approaches from the sides are noticed.
            // Detect approaches well before the pointer reaches the button's sides.
            const dangerPadding = 180;
            const isNearButton = event.clientX >= rect.left - dangerPadding &&
                event.clientX <= rect.right + dangerPadding &&
                event.clientY >= rect.top - dangerPadding &&
                event.clientY <= rect.bottom + dangerPadding;
            // Keep the button still below 30 pixels per second.
            const isMovingFast = pointerSpeed >= 0.03;
            const canEscapeAgain = currentTime - lastEscapeTime >= 250;

            // Ignore slow movement, but move when the pointer enters quickly.
            if (isNearButton && isMovingFast && canEscapeAgain) {
                lastEscapeTime = currentTime;

                // Calculate the furthest position inside the image stage.
                const minX = button.offsetWidth / 2;
                const maxX = homeStage.clientWidth - minX;

                // Keep the button below the header and above the stage bottom.
                const minY = button.offsetHeight / 2;
                const maxY = homeStage.clientHeight - minY;


                // Generate a random horizontal position.
                const randomX = minX + Math.random() * (maxX - minX);

                // Generate a random vertical position.
                const randomY = minY + Math.random() * (maxY - minY);


                // Move the button to the random horizontal position.
                button.style.left = randomX + "px";

                // Move the button to the random vertical position.
                button.style.top = randomY + "px";
            }
        });


        // Listen for the user clicking the button.
        button.addEventListener("click", () => {

            // Unlock the navigation for this browser session.
            sessionStorage.setItem("navUnlocked", "true");

            // Send the user to page1.html when the button is clicked.
            window.location.href = "page1.html";

        });


        /* =========================================
           RANDOM WHEEZER MOVEMENT
           ========================================= */


        // Find the Wheezer image using its CSS class.
        const image = document.querySelector(".wheezer");

        // Find the container that holds the Wheezer image.
        const container = document.querySelector(".container");


        // =========================================
        // FUNCTION TO MOVE WHEEZER
        // =========================================

        // This function moves Wheezer to a random position
        // inside the container.
        function moveToRandomPlace() {

            // Get the width of the container.
            const containerWidth = container.clientWidth;

            // Get the height of the container.
            const containerHeight = container.clientHeight;


            // Get the width of the Wheezer image.
            const imageWidth = image.clientWidth;

            // Get the height of the Wheezer image.
            const imageHeight = image.clientHeight;


            // Work out the maximum horizontal position
            // where the image can fit inside the container.
            //
            // Math.max(0, ...) prevents the value from
            // becoming negative if the image is too large.
            const maxLeft = Math.max(0, containerWidth - imageWidth);

            // Work out the maximum vertical position
            // where the image can fit inside the container.
            const maxTop = Math.max(0, containerHeight - imageHeight);


            // Generate a random horizontal position.
            // Math.floor() rounds the number down to a whole pixel.
            const randomLeft = Math.floor(Math.random() * (maxLeft + 1));

            // Generate a random vertical position.
            const randomTop = Math.floor(Math.random() * (maxTop + 1));


            // Move the Wheezer image horizontally.
            image.style.left = randomLeft + "px";

            // Move the Wheezer image vertically.
            image.style.top = randomTop + "px";
        }


        // =========================================
        // START WHEEZER MOVEMENT
        // =========================================

        // Wait until the Wheezer image has completely loaded.
        image.addEventListener("load", () => {

            // Move Wheezer to a random position immediately.
            moveToRandomPlace();

            // Move Wheezer to another random position every 2 seconds.
            setInterval(moveToRandomPlace, 2000);

        });


        // =========================================
        // WHEEZER ESCAPES FROM MOUSE
        // =========================================

        // Detect when the mouse pointer enters the Wheezer image.
        image.addEventListener("mouseenter", () => {

            // Immediately move Wheezer to another random position.
            moveToRandomPlace();

        });

    </script>

</body>

</html>
