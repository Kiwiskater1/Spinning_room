<!DOCTYPE html>
<html lang="en">

<head>
    <!-- Sets the character encoding for the webpage -->
    <meta charset="UTF-8">

    <!-- Makes the webpage responsive on different screen sizes -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Sets the title shown in the browser tab -->
    <title>Spinning Cars</title>

    <!-- Links the CSS stylesheet -->
    <link rel="stylesheet" href="jordan.css">
</head>

<body>

    <!-- =========================================
         PAGE HEADER
         ========================================= -->

    <!-- Contains the main heading of the webpage -->
    <header>

        <!-- Main heading displayed at the top of the page -->
        <h1>Spinning Cars</h1>

    </header>


    <!-- =========================================
         MAIN CONTENT
         ========================================= -->

    <!-- Contains the main content of the webpage -->
    <main>

        <!--
            Container that holds the LamborghiniE image.
            The container allows the image to move around inside it.
        -->
        <div class="container">
            <!--
                Displays the Lamborghini image.
                The "lamborghiniE" class can be used by CSS or JavaScript
                to control the image's appearance and movement.
            -->
            <img 
                src="images/LamborghiniE.png" 
                alt="LamborghiniE" 
                class="lamborghiniE"
            >
        </div>

    </main>

    <!-- Links the JavaScript file -->
    <script src="jordan.js"></script>

</body>
</html>
